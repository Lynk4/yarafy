name: "YARA Rule Lint & Test"

on:
  push:
    paths:
      - "yara-rules/**"
      - "src/**"
      - ".github/workflows/yara_lint.yml"
  pull_request:
    paths:
      - "yara-rules/**"
      - "src/**"

jobs:
  lint-rules:
    name: "Validate YARA Syntax"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Lint & Validate YARA Rules"
        run: |
          python -m src.main lint
