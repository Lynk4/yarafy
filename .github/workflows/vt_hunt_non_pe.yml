name: "VirusTotal Hunt - Non-PE & Scripts"

on:
  workflow_dispatch:
    inputs:
      query:
        description: "VirusTotal Intelligence Search Query"
        required: true
        default: "(type:powershell OR type:script OR type:python OR type:javascript) positives:5+ fs:30d+"
      limit:
        description: "Number of live samples to download and scan"
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  vt-hunt-non-pe:
    name: "VT Non-PE Sample Download & YARA Scan"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute VirusTotal Live Hunt (Non-PE)"
        env:
          VT_ENTERPRISE_API_KEY: ${{ secrets.VT_ENTERPRISE_API_KEY || secrets.VT_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m src.main vt-hunt --platform non-pe --query "${{ github.event.inputs.query }}" --limit ${{ github.event.inputs.limit }}

      - name: "Commit and Push Updated Telemetry"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/ dashboard/
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): update hits from VirusTotal Non-PE hunt [skip ci]"
            git push
          fi
