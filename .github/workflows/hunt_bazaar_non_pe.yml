name: "MalwareBazaar Hunt - Non-PE & Scripts"

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "MalwareBazaar Tags to hunt (comma-separated, e.g. PowerShell, Python, bash, script)"
        required: false
        default: "PowerShell,Python,bash,script"
      file_type:
        description: "File Type filter (e.g. script, sh, py, js, or blank for all)"
        required: false
        default: "script"
      limit:
        description: "Number of samples to fetch per query"
        required: true
        default: "25"

permissions:
  contents: write

jobs:
  hunt-non-pe:
    name: "MalwareBazaar Non-PE Sample Hunt"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Threat Feed Hunting (Non-PE)"
        env:
          MALWAREBAZAAR_API_KEY: ${{ secrets.MALWAREBAZAAR_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python -m src.main hunt --platform non-pe --tags "${{ github.event.inputs.tags }}" --file-type "${{ github.event.inputs.file_type }}" --limit ${{ github.event.inputs.limit }}

      - name: "Commit and Push Updated Telemetry"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/ dashboard/
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): update hits from MalwareBazaar Non-PE hunt [skip ci]"
            git push
          fi
