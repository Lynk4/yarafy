name: "Refresh VirusTotal Scores"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh Mode (zero-only: samples with 0 score, or all: all past hits)"
        required: true
        default: "zero-only"
        type: choice
        options:
          - "zero-only"
          - "all"
      limit:
        description: "Maximum number of past samples to query (Free API: 4/min)"
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  refresh-vt:
    name: "Refresh VirusTotal AV Scores"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute VirusTotal Score Refresh"
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          python -m src.main refresh-vt --mode "${{ github.event.inputs.mode }}" --limit ${{ github.event.inputs.limit }}

      - name: "Commit and Push Updated Telemetry"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/ dashboard/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(telemetry): refresh VirusTotal scores for historical hits [skip ci]"
            git push
          fi
